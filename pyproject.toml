[project]
name = "support-ticket-app"
version = "0.1.0"
description = "Databricks support ticket app backed by Lakebase"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.47.0",
  "psycopg[binary]>=3.2.0",
  "python-dotenv>=1.0.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
  "ruff>=0.6.0",
  "databricks-sdk>=0.23.0",
]

[tool.ruff]
line-length = 100
